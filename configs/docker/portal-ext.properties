##
## Ambiente Docker Compose
##
## Banco de dados: Hypersonic embutido (padrao, persistido no volume liferay-data)
## Busca: Elasticsearch sidecar embutido no Liferay (padrao)
##

##
## Setup
##

    setup.wizard.enabled=false

    company.default.locale=pt_BR

##
## Hosts validos para acessar o portal (protecao contra host header attack).
## Inclua aqui o IP/hostname usado para acessar o servidor.
## Em ambiente de teste, "*" libera qualquer host.
##

    virtual.hosts.valid.hosts=localhost,127.0.0.1,[::1],192.168.118.125

##
## Cadastro de usuarios (link "Criar conta" na tela de login)
##

    company.security.strangers=true
    company.security.strangers.verify=false
    company.security.strangers.with.mx=false

##
## Facilita o primeiro login (sem termos de uso / perguntas lembrete)
##

    terms.of.use.required=false
    users.reminder.queries.enabled=false
    users.reminder.queries.custom.question.enabled=false
