name: Deploy Liferay CI/CD
run-name: ${{ github.actor }} is running CI/CD workflow default
on:
  push:
    branches: ['dev-2026.q1.x']
jobs:
  deploy-api:
    runs-on: self-hosted
    steps:
      - name: Coding checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Deploy bundles
        run: |
          BEFORE="${{ github.event.before }}"
          AFTER="${{ github.sha }}"
          # Em push normal, compara o estado anterior (before) com o novo (after).
          # No primeiro push da branch (before = 40 zeros) ou quando o commit
          # anterior nao existe localmente, usa o primeiro pai de AFTER.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BASE="${AFTER}~1"
          else
              BASE="$BEFORE"
          fi
          echo "Comparing $BASE..$AFTER"
          CHANGED_FILES=$(git diff --name-only "$BASE" "$AFTER")
          echo "Modified files:"
          echo "$CHANGED_FILES"
          DEPLOY_DIRS=()
          for file in $CHANGED_FILES; do
              dirpath=$(dirname "$file")
              while [[ "$dirpath" != "." && "$dirpath" != "/" ]]; do
                  if [[ -f "$dirpath/build.gradle" || -f "$dirpath/package.json" ]]; then
                      echo "Found build.gradle or package.json in: $dirpath"
                      if [[ ! " ${DEPLOY_DIRS[@]} " =~ " ${dirpath} " ]]; then
                          DEPLOY_DIRS+=("$dirpath")
                      fi
                      break
                  fi
                  dirpath=$(dirname "$dirpath")
              done
          done
          echo -e "\nDirectories for deploy:"
          for dir in "${DEPLOY_DIRS[@]}"; do
              echo "$dir"
          done
          echo -e "\nRun deploy on directory:"
          # O runner roda num checkout isolado (actions-runner/_work/...), cujo
          # bundles/ NAO e o que o container monta. Por isso, apos compilar,
          # copiamos o artefato para dentro do container em execucao, onde o
          # OSGi fileinstall o instala automaticamente.
          CONTAINER=upgrade-teste-liferay
          for dir in "${DEPLOY_DIRS[@]}"; do
              echo "-> Build in: $dir"
              (cd "$dir" && blade gw clean assemble)
              for jar in "$dir"/build/libs/*.jar; do
                  [ -e "$jar" ] || continue
                  echo "   copiando $(basename "$jar") -> $CONTAINER:/opt/liferay/osgi/modules/"
                  docker cp "$jar" "$CONTAINER:/opt/liferay/osgi/modules/"
              done
              for war in "$dir"/build/libs/*.war; do
                  [ -e "$war" ] || continue
                  echo "   copiando $(basename "$war") -> $CONTAINER:/opt/liferay/osgi/war/"
                  docker cp "$war" "$CONTAINER:/opt/liferay/osgi/war/"
              done
              echo
          done
      